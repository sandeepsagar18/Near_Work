name: device_locator
description: Advanced Flutter Device Locator with Turso Edge DB, Offline OpenStreetMap Engine, BLE Mesh Relay & SMS Real-Time Streaming.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^10.1.1
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5
  intl: ^0.18.1
  sensors_plus: ^3.1.0
  battery_plus: ^5.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
