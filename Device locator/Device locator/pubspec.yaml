name: device_locator
description: Advanced Flutter Device Locator with Turso Edge DB, Offline OpenStreetMap Engine, BLE Mesh Relay & SMS Real-Time Streaming.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.0.5
  intl: ^0.18.1
  flutter_compass: ^0.7.0
  sensors_plus: ^3.1.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
